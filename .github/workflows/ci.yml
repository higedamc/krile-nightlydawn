name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore NightlyDawn.sln

      - run: dotnet build NightlyDawn.sln --no-restore --configuration Release

      - run: dotnet test NightlyDawn.sln --no-build --configuration Release

      - name: Upload MainWindow render frames
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mainwindow-render-frames
          path: tests/NightlyDawn.App.RenderTests/bin/Release/net8.0/RenderFrames/*.png
          if-no-files-found: error
